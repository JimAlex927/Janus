name: Janus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep this pinned to the patched toolchain used for the current
        # qualification record; refresh it deliberately for security fixes.
        go-version: ["1.25.1"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test -count=2 ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build static Linux artifact
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o janus-linux-amd64 ./cmd/janus

      - name: Check diff and artifact
        run: |
          git diff --check
          test -x janus-linux-amd64
          sha256sum janus-linux-amd64
