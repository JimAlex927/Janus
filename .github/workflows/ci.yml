name: Janus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        # Keep this pinned to the patched toolchain used for the current
        # qualification record; refresh it deliberately for security fixes.
        go-version: ["1.25.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Linux release gate
        run: ./scripts/verify-linux.sh

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check diff
        run: |
          git diff --check
